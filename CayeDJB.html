function p2(n){return n<10?"0"+n:""+n;}
function fd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}

function hn(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))&0xffff;return h;}
function pc(id){return PAL[hn(id)%PAL.length];}
function wR(d,dk){
  if(dk){
    for(var _i=0;_i<TEMP_RATES.length;_i++){
      var _t=TEMP_RATES[_i];
      if(_t.dog===d&&dk>=_t.from&&dk<=_t.to&&_t.w!=null) return _t.w;
    }
  }
  var baseRate = WR;
  if(dk && dk >= "2026-03-09") baseRate = 32.40;
  var r=(CUSTOM_RATES[d]&&CUSTOM_RATES[d].w!=null)?CUSTOM_RATES[d].w:(d==="nellie"?NW:baseRate);
  var mult=(d.indexOf("&")>=0)?2:1;
  return Math.round(r*mult*100)/100;
}
function bR(d,dk){
  if(dk){
    for(var _i=0;_i<TEMP_RATES.length;_i++){
      var _t=TEMP_RATES[_i];
      if(_t.dog===d&&dk>=_t.from&&dk<=_t.to&&_t.b!=null) return _t.b;

}

  t1(sh).forEach(cw);t2(sh).forEach(cw);t3(sh).forEach(cw);
  return{w:w,b:b,t:w+b};
}

function calcBill(mth,att,pay){
  var walks={},board={},walkCnt={},boardCnt={};
  // Include both WD and CUSTOM_DAYS dates
  var allWalkDates={};
  Object.keys(WD).forEach(function(dk){if(dk.slice(0,7)===mth)allWalkDates[dk]=1;});
  Object.keys(CUSTOM_DAYS).forEach(function(dk){if(dk.slice(0,7)===mth)allWalkDates[dk]=1;});
  Object.keys(allWalkDates).forEach(function(dk){
    var sh=getSh(dk),bm={};
    getBD(dk).forEach(function(d){bm[d]=1;});
    function aw(d){if(bm[d])return;var ok=!isMar(dk)?true:(att[dk+"|"+d]===true);if(ok){walks[d]=Math.round(((walks[d]||0)+wR(d,dk))*100)/100;walkCnt[d]=(walkCnt[d]||0)+1;}}
    t1(sh).forEach(aw);t2(sh).forEach(aw);t3(sh).forEach(aw);
  });
  // Include all dates (WD keys for custom days + BD keys for base boarding + CUSTOM_BD)
  var allBoardDates={};
  Object.keys(BD).forEach(function(dk){if(dk.slice(0,7)===mth)allBoardDates[dk]=1;});
  Object.keys(CUSTOM_BD).forEach(function(dk){if(dk.slice(0,7)===mth)allBoardDates[dk]=1;});
  Object.keys(allBoardDates).forEach(function(dk){
    getBD(dk).forEach(function(d){board[d]=Math.round(((board[d]||0)+bR(d,dk))*100)/100;boardCnt[d]=(boardCnt[d]||0)+1;});
  });
  var res={};
  Object.keys(walks).forEach(function(d){res[d]=(res[d]||{dog:d,wA:0,bA:0});res[d].wA=walks[d];});
  Object.keys(board).forEach(function(d){res[d]=(res[d]||{dog:d,wA:0,bA:0});res[d].bA=board[d];});
  return Object.keys(res).map(function(d){
    var r=res[d];r.tot=Math.round((r.wA+r.bA)*100)/100;
    r.wN=walkCnt[d]||0;
    r.bN=boardCnt[d]||0;
    r.paid=pay[mth+"|"+d]||"pending";
    return r;
  }).filter(function(r){return r.tot>0;});
}

function clientBill(mth,att,pay){
  var raw=calcBill(mth,att,pay);
  var dm={};raw.forEach(function(r){dm[r.dog]=r;});
  var out=[];
  CLIENTS.forEach(function(cl){
    var tot=0,wA=0,bA=0,wN=0,bN=0,ddata=[];
    var activeDogs=cl.dogs.filter(function(d){return !INACTIVE_DOGS[d];});
    activeDogs.forEach(function(dog){
      var r=dm[dog];
      if(r){tot+=r.tot;wA+=r.wA;bA+=r.bA;wN+=r.wN;bN+=r.bN;ddata.push(r);}
    });
    if(!tot)return;
    var dynLabel=activeDogs.map(function(d){return getDn(d);}).join(" & ");
    if(!dynLabel)return;
    var pk=mth+"|cl|"+cl.id;
    var paid=pay[pk]||(pay[mth+"|"+cl.dogs[0]]==="paid"?"paid":"pending");
    out.push({id:cl.id,label:dynLabel,dogs:cl.dogs,ddata:ddata,tot:tot,wA:wA,bA:bA,wN:wN,bN:bN,paid:paid,pair:cl.pair,special:cl.special,longstay:cl.longstay});
  });
  out.sort(function(a,b){return b.tot-a.tot;});
  return out;
}

/* Get shift data for a day - custom overrides first, filter inactive dogs */
function filterInactive(arr){return(arr||[]).filter(function(d){return!INACTIVE_DOGS[d];});}
function getSh(dk){
  var base=CUSTOM_DAYS[dk]||(WD[dk])||{s1:[],s2:[],s3:[],s4:[]};
  return{s1:filterInactive(base.s1),s2:filterInactive(base.s2),s3:filterInactive(base.s3),s4:filterInactive(base.s4)};
}
/* Get boarding for a day - custom overrides first, filter inactive dogs */
function getBD(dk){
  var base=(CUSTOM_BD[dk]!==undefined)?CUSTOM_BD[dk]:(BD[dk]||[]);
  return base.filter(function(d){return!INACTIVE_DOGS[d];});
}

function exportBackup(){
  var data={
    att:att, pay:pay,
    CUSTOM_DAYS:CUSTOM_DAYS, CUSTOM_DOGS:CUSTOM_DOGS,
    CUSTOM_BD:CUSTOM_BD, INACTIVE_DOGS:INACTIVE_DOGS,
    EXPENSES:EXPENSES, CUSTOM_RATES:CUSTOM_RATES,
    TEMP_RATES:TEMP_RATES, WR:WR, BR:BR,
    _exported: new Date().toISOString(),
    _version: "CayeDJB-backup-v1"
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="CayeDJB_backup_"+TODAY.replace(/-/g,"")+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file){
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!data._version||data._version.indexOf("CayeDJB-backup")<0){
        alert("Archivo no válido. Debe ser un backup de CayeDJB.");return;
      }
      if(!confirm("¿Restaurar backup del "+data._exported+"?\nEsto REEMPLAZARÁ todos los datos actuales."))return;
      if(data.att)att=data.att;
      if(data.pay)pay=data.pay;
      if(data.CUSTOM_DAYS)CUSTOM_DAYS=data.CUSTOM_DAYS;
      if(data.CUSTOM_DOGS)CUSTOM_DOGS=data.CUSTOM_DOGS;
      if(data.CUSTOM_BD)CUSTOM_BD=data.CUSTOM_BD;
      if(data.INACTIVE_DOGS)INACTIVE_DOGS=data.INACTIVE_DOGS;
      if(data.EXPENSES)EXPENSES=data.EXPENSES;
      if(data.CUSTOM_RATES)CUSTOM_RATES=data.CUSTOM_RATES;
      if(data.TEMP_RATES)TEMP_RATES=data.TEMP_RATES;
      if(data.WR!=null)WR=data.WR;
      if(data.BR!=null)BR=data.BR;
      Object.keys(CUSTOM_DOGS).forEach(function(id){
        var found=false;
        for(var ci=0;ci<CLIENTS.length;ci++){
          if(CLIENTS[ci].dogs.indexOf(id)>=0){found=true;break;}
        }
        if(!found)CLIENTS.push({id:"c_"+id,label:CUSTOM_DOGS[id].n||id,dogs:[id]});
      });
      saveS();render();
      alert("✅ Backup restaurado correctamente.");
    }catch(e){alert("Error al leer backup: "+e.message);}
  };
  reader.readAsText(file);
}

function archiveYear(year){
  var prefix=year+"-";
  var attKeys=Object.keys(att).filter(function(k){return k.indexOf(prefix)===0;});
  var payKeys=Object.keys(pay).filter(function(k){return k.indexOf(prefix)===0;});
  var cdKeys=Object.keys(CUSTOM_DAYS).filter(function(k){return k.indexOf(prefix)===0;});
  var cbdKeys=Object.keys(CUSTOM_BD).filter(function(k){return k.indexOf(prefix)===0;});
  var total=attKeys.length+payKeys.length+cdKeys.length+cbdKeys.length;
  if(!total){alert("No hay datos del año "+year+" para archivar.");return;}
  if(!confirm("Archivar "+total+" registros del "+year+"?\nSe exportará un backup antes de eliminarlos."))return;
  exportBackup();
  attKeys.forEach(function(k){delete att[k];});
  payKeys.forEach(function(k){delete pay[k];});
  cdKeys.forEach(function(k){delete CUSTOM_DAYS[k];});
  cbdKeys.forEach(function(k){delete CUSTOM_BD[k];});
  saveS();render();
  alert("✅ "+total+" registros del "+year+" archivados. Backup descargado.");
}

// FIREBASE v4 — los listeners realtime de CayeSync.bootstrap() reemplazan el pull.
function pcSyncPull(){ /* no-op — el listener mantiene los globals al día */ }

// FIREBASE v4 — diff-and-emit hacia Firestore.
// CayeSync compara los globals contra lastSynced* y emite los cambios:
//   - att/shiftDone → events/{id} con LWW por key
//   - state config → state/main (merge: CUSTOM_DOGS, CUSTOM_BD, CUSTOM_DAYS,
//     INACTIVE_DOGS, CUSTOM_RATES, TEMP_RATES, WR, BR, pay)
//   - EXPENSES → expenses/{id}
function pcSyncPush(){
  if (!window.CayeSync) return;
  try {
    window.CayeSync.syncFromGlobals({
      att: att,
      shiftDone: (window.pcShiftDone||{}),
      state: {
        CUSTOM_DOGS: CUSTOM_DOGS,
        CUSTOM_BD:   CUSTOM_BD,
        CUSTOM_DAYS: CUSTOM_DAYS,
        INACTIVE_DOGS: INACTIVE_DOGS,
        CUSTOM_RATES: CUSTOM_RATES,
        TEMP_RATES:   TEMP_RATES,
        WR: WR,
        BR: BR,
        pay: pay
      },
      expenses: EXPENSES
    });
  } catch(e){ console.error("pcSyncPush failed", e); }
}

// FIREBASE v4 — arranca los listeners realtime. onState/onEvents/onExpenses
// sobrescriben los globals y re-renderizan.
function pcBootstrapSync(){
  if (!window.CayeSync) return;
  window.CayeSync.bootstrap({
    onState: function(data){
      if (data.CUSTOM_DOGS)   CUSTOM_DOGS   = data.CUSTOM_DOGS;
      if (data.CUSTOM_BD)     CUSTOM_BD     = data.CUSTOM_BD;
      if (data.CUSTOM_DAYS)   CUSTOM_DAYS   = data.CUSTOM_DAYS;
      if (data.INACTIVE_DOGS) INACTIVE_DOGS = data.INACTIVE_DOGS;
      if (data.CUSTOM_RATES)  CUSTOM_RATES  = data.CUSTOM_RATES;
      if (data.TEMP_RATES)    TEMP_RATES    = data.TEMP_RATES;
      if (typeof data.WR === "number") WR = data.WR;
      if (typeof data.BR === "number") BR = data.BR;
      if (data.pay)           pay           = data.pay;
      try { render(); } catch(e){ console.error("render after onState failed", e); }
    },
    onEvents: function(reduced){
      att = reduced.att || {};
      window.pcShiftDone = reduced.shiftDone || {};
      try { render(); } catch(e){ console.error("render after onEvents failed", e); }
    },
    onExpenses: function(arr){
      EXPENSES = arr || [];
      try { render(); } catch(e){ console.error("render after onExpenses failed", e); }
    }
  });
}
setTimeout(pcBootstrapSync, 100);

/* Calculate billing for any arbitrary date range for one client */
function rangeBill(clientId, fromDk, toDk) {
  var cl = null;
  for(var i=0;i<CLIENTS.length;i++){if(CLIENTS[i].id===clientId){cl=CLIENTS[i];break;}}
  if(!cl) return null;

  var days = [];
  var cur = new Date(fromDk);
  var end = new Date(toDk);
  while(cur <= end) {
    var dk = fd(cur);
    var dayInfo = {dk: dk, dogs: []};
    var sh = getSh(dk);
    var bds = getBD(dk);
    var bm = {};
    bds.forEach(function(d){bm[d]=1;});
    var dow = cur.getDay();
    var isWknd = dow===0||dow===6;

    cl.dogs.forEach(function(dog) {
      var inBoard = !!bm[dog];
      var inT1 = t1(sh).indexOf(dog) >= 0;
      var inT2 = t2(sh).indexOf(dog) >= 0;
      var inT3 = t3(sh).indexOf(dog) >= 0;
      var inAnyShift = inT1||inT2||inT3;

      if(!inAnyShift && !inBoard) return;

      var entries = [];

      if(inBoard) {
        entries.push({type:"boarding", amount: bR(dog,dk), label:"Boarding"});
      } else {
        if(inT1){
          var ok = !isMar(dk)?true:(att[dk+"|"+dog]===true);
          if(ok) entries.push({type:"walk", shift:"T1", amount: wR(dog,dk), label:"T1 · 8:15"});
        }
        if(inT2){
          var ok2 = !isMar(dk)?true:(att[dk+"|"+dog]===true);
          if(ok2) entries.push({type:"walk", shift:"T2", amount: wR(dog,dk), label:"T2 · 11:20"});
        }
        if(inT3){
          var ok3 = !isMar(dk)?true:(att[dk+"|"+dog]===true);
          if(ok3) entries.push({type:"walk", shift:"T3", amount: wR(dog,dk), label:"T3 · 13:30"});
        }
      }

      if(entries.length) dayInfo.dogs.push({dog: dog, entries: entries, inBoard: inBoard});
    });

    if(dayInfo.dogs.length || (isWknd && bds.some(function(d){return cl.dogs.indexOf(d)>=0;}))) {
      // boarding on weekends
      if(!dayInfo.dogs.length && isWknd) {
        cl.dogs.forEach(function(dog){
          if(bm[dog]) dayInfo.dogs.push({dog:dog,entries:[{type:"boarding",amount:bR(dog,dk),label:"Boarding"}],inBoard:true});
        });
      }
      if(dayInfo.dogs.length) days.push(dayInfo);
    }
    cur.setDate(cur.getDate()+1);
  }

  // totals
  var totalW=0, totalB=0, walkDays=0, boardNights=0;
  days.forEach(function(day){
    day.dogs.forEach(function(dd){
      dd.entries.forEach(function(e){
        if(e.type==="walk"){totalW+=Number(e.amount);walkDays++;}
        else{totalB+=Number(e.amount);boardNights++;}
      });
    });
  });

  return {client: cl, days: days, totalW: totalW, totalB: totalB,
          total: totalW+totalB, walkDays: walkDays, boardNights: boardNights,
          from: fromDk, to: toDk};
}

        CLIENTS=CLIENTS.filter(function(cl){return cl.id!=="c_"+id;});
        // Limpiar CUSTOM_BD
        Object.keys(CUSTOM_BD).forEach(function(dk2){
          CUSTOM_BD[dk2]=(CUSTOM_BD[dk2]||[]).filter(function(d){return d!==id;});
          if(!CUSTOM_BD[dk2].length&&!(BD[dk2]||[]).length)delete CUSTOM_BD[dk2];
        });
        // Limpiar CUSTOM_RATES y TEMP_RATES
        delete CUSTOM_RATES[id];
        TEMP_RATES=TEMP_RATES.filter(function(tr){return tr.dog!==id;});
        saveS();rBill();
      };
    });
    document.querySelectorAll(".dm-rename").forEach(function(btn){
      btn.onclick=function(){
        var id=this.getAttribute("data-id");
        if(!CUSTOM_DOGS[id]){alert("Solo puedes renombrar perros creados por ti.");return;}
        var nm2=prompt("Nuevo nombre:",getDn(id));
        if(nm2&&nm2.trim()){CUSTOM_DOGS[id].n=nm2.trim();for(var ci=0;ci<CLIENTS.length;ci++){if(CLIENTS[ci].id==="c_"+id){CLIENTS[ci].label=nm2.trim();break;}}saveS();rBill();}
      };
    });
    document.querySelectorAll(".dm-deactivate").forEach(function(btn){
      btn.onclick=function(){
        var id=this.getAttribute("data-dog-id");if(!id)return;
        if(!confirm("Dar de baja a "+getDn(id)+"?\nSe quitara de turnos y boarding futuros."))return;
        INACTIVE_DOGS[id]=true;
        Object.keys(CUSTOM_DAYS).forEach(function(dk2){if(dk2<TODAY)return;var s2=CUSTOM_DAYS[dk2];["s1","s2","s3","s4"].forEach(function(s){s2[s]=(s2[s]||[]).filter(function(d){return d!==id;});});});
        Object.keys(CUSTOM_BD).forEach(function(dk2){if(dk2<TODAY)return;CUSTOM_BD[dk2]=(CUSTOM_BD[dk2]||[]).filter(function(d){return d!==id;});});
        Object.keys(att).forEach(function(k){
          if(k.indexOf("|"+id)>=0){
            var attDk=k.split("|")[0];
            if(attDk>=TODAY)delete att[k];
          }
        });
        saveS();rBill();
      };
    });
    document.querySelectorAll(".dm-reactivate").forEach(function(btn){
      btn.onclick=function(){
        var id=this.getAttribute("data-dog-id");if(!id)return;
        delete INACTIVE_DOGS[id];
        saveS();rBill();
        alert(getDn(id)+" reactivado.");
      };
    });
  }

  // ── Rates panel listeners ──
  if(ratesOpen){
    var rcl=document.getElementById("rates-close");
    if(rcl)rcl.onclick=function(){ratesOpen=false;rBill();};
    var rsave=document.getElementById("rates-save");
    if(rsave)rsave.onclick=function(){
      // Save global defaults
      var oldWR=WR,oldBR=BR;
      document.querySelectorAll(".rate-global").forEach(function(inp){
        var rid=inp.getAttribute("data-rid");
        var val=parseFloat(inp.value);
        if(!isNaN(val)&&val>0){
          if(rid==="wr")WR=val;
          else if(rid==="br")BR=val;
        }
      });
      if(WR!==oldWR||BR!==oldBR){
        alert("\u26a0\ufe0f Las nuevas tarifas se aplicar\u00e1n a TODOS los meses, incluidos los ya pagados. Si necesitas mantener tarifas hist\u00f3ricas, usa Tarifas Temporales con rango de fechas.");
      }
      // Save per-dog rates
      var dogRates={};
      document.querySelectorAll(".rate-dog-w").forEach(function(inp){
        var did=inp.getAttribute("data-dogid");
        var val=inp.value.trim();
        if(!dogRates[did])dogRates[did]={};
        dogRates[did].w=(val!==""&&!isNaN(parseFloat(val)))?parseFloat(val):null;
      });
      document.querySelectorAll(".rate-dog-b").forEach(function(inp){
        var did=inp.getAttribute("data-dogid");
        var val=inp.value.trim();
        if(!dogRates[did])dogRates[did]={};
        dogRates[did].b=(val!==""&&!isNaN(parseFloat(val)))?parseFloat(val):null;
      });
      var spBlock=false;
      Object.keys(dogRates).forEach(function(did){
        var r=dogRates[did];
        if(r.w==null&&r.b==null){delete CUSTOM_RATES[did];return;}
        var dp=getDP(did);
        if(dp&&dp.sp&&(r.w!=null||r.b!=null)){
          if(!confirm("⚠️ "+getDn(did)+" tiene tarifa especial (£"+wR(did)+"/£"+bR(did)+"). ¿Seguro que quieres cambiarla?")){spBlock=true;return;}
        }
        CUSTOM_RATES[did]=r;
      });
      if(spBlock)return;
      saveS();
      var savedEl=document.getElementById("rates-saved");
      if(savedEl){savedEl.style.display="inline";setTimeout(function(){savedEl.style.display="none";},1500);}
    };
    document.querySelectorAll(".rate-reset").forEach(function(btn){
      btn.onclick=function(){
        delete CUSTOM_RATES[this.getAttribute("data-dogid")];
        saveS();rBill();
      };
    });

    // Temp rate add
    var trAddBtn=document.getElementById("tr-add");
    if(trAddBtn)trAddBtn.onclick=function(){
      var dogEl=document.getElementById("tr-dog");
      var fromEl=document.getElementById("tr-from");
      var toEl=document.getElementById("tr-to");
      var wEl=document.getElementById("tr-w");
      var bEl=document.getElementById("tr-b");
      var errEl=document.getElementById("tr-err");
      if(!dogEl||!fromEl||!toEl||!wEl||!bEl)return;
      var dog=dogEl.value,from=fromEl.value,to=toEl.value;
      var w=wEl.value.trim(),b=bEl.value.trim();
      // Validate without alert()
      var err="";
      if(!dog) err="Selecciona un perro.";
      else if(!from||!to) err="Pon las fechas de inicio y fin.";
      else if(from>to) err="La fecha inicio debe ser anterior o igual a la final.";
      else if(!w&&!b) err="Introduce al menos un precio.";
      if(err){
        if(errEl){errEl.textContent=err;errEl.style.display="block";}
        return;
      }
      if(errEl)errEl.style.display="none";
      // Verificar solapamientos
      var overlap=false;
      for(var tri=0;tri<TEMP_RATES.length;tri++){
        var _tr=TEMP_RATES[tri];
        if(_tr.dog===dog&&from<=_tr.to&&to>=_tr.from){overlap=true;break;}
      }
      if(overlap){
        if(!confirm("Ya existe una tarifa temporal para "+getDn(dog)+" en ese rango. La nueva se añadirá pero puede crear resultados inesperados. ¿Continuar?"))return;
      }
      TEMP_RATES.push({
        id:"tr"+Date.now(),dog:dog,from:from,to:to,
        w:w!==""&&!isNaN(parseFloat(w))?parseFloat(w):null,
        b:b!==""&&!isNaN(parseFloat(b))?parseFloat(b):null
      });
      // Clear inputs
      dogEl.value="";fromEl.value="";toEl.value="";wEl.value="";bEl.value="";
      saveS();
      // Re-render just the temp rates list area without closing panel
      rBill();
    };

    // Temp rate delete — uses data-tridx
    document.querySelectorAll(".tr-del").forEach(function(btn){
      btn.onclick=function(){
        var tidx=parseInt(this.getAttribute("data-tridx"));
        if(!isNaN(tidx)&&tidx>=0&&tidx<TEMP_RATES.length){
          TEMP_RATES.splice(tidx,1);
          saveS();rBill();
        }
      };
    });
    // Temp rate edit
    document.querySelectorAll(".tr-edit").forEach(function(btn){
      btn.onclick=function(){
        var tri=parseInt(this.getAttribute("data-tri"));
        var tr=TEMP_RATES[tri];
        if(!tr)return;
        var newW=prompt("Walk rate para "+getDn(tr.dog)+" ("+tr.from+" a "+tr.to+"):",tr.w);
        if(newW===null)return;
        var newB=prompt("Board rate:",tr.b);
        if(newB===null)return;
        TEMP_RATES[tri].w=parseFloat(newW);
        TEMP_RATES[tri].b=parseFloat(newB);
        saveS();rBill();
      };
    });
  }

  // ── Export modal listeners ──
  if(exportOpen) attachExportListeners();

  // ── Boarding manager from billing ──
  if(billBrdMgr){
    var bbClose=document.getElementById("brd-close");
    if(bbClose)bbClose.onclick=function(){billBrdMgr=false;rBill();};
    var bbAddBtn=document.getElementById("brd-add-today");
    if(bbAddBtn)bbAddBtn.onclick=function(){
      var sel=document.getElementById("brd-add-sel");
      var dkNow=fd(new Date());
      if(!sel||!sel.value)return;
      var cur=getBD(dkNow).slice();
      if(cur.indexOf(sel.value)<0)cur.push(sel.value);
      CUSTOM_BD[dkNow]=cur;saveS();rBill();
    };
    document.querySelectorAll(".brd-remove-today").forEach(function(btn){
      btn.onclick=function(){
        var dog2=this.getAttribute("data-dog");
        var dkNow2=fd(new Date());
        var cur2=getBD(dkNow2).filter(function(d){return d!==dog2;});
        CUSTOM_BD[dkNow2]=cur2;saveS();rBill();
      };
    });
    var bbRngAdd=document.getElementById("brd-rng-add");
    if(bbRngAdd)bbRngAdd.onclick=function(){
      var dogEl=document.getElementById("brd-rng-dog");
      var frEl=document.getElementById("brd-rng-from");
      var toEl=document.getElementById("brd-rng-to");
      if(!dogEl||!dogEl.value||!frEl||!frEl.value||!toEl||!toEl.value){alert("Rellena perro, desde y hasta.");return;}
      if(frEl.value>toEl.value){alert("Fecha inicio debe ser anterior a la final.");return;}
      var dogR=dogEl.value,frR=frEl.value,toR=toEl.value;
      var dR=new Date(frR),eR=new Date(toR),cntR=0;
      while(dR<=eR){
        var dkkR=fd(dR);var arrR=getBD(dkkR).slice();
        if(arrR.indexOf(dogR)<0)arrR.push(dogR);
        CUSTOM_BD[dkkR]=arrR;dR.setDate(dR.getDate()+1);cntR++;
      }
      saveS();alert(getDn(dogR)+" en boarding "+frR+" a "+toR+" ("+cntR+" dias).");rBill();
    };
    var bbRngDel=document.getElementById("brd-rng-del");
    if(bbRngDel)bbRngDel.onclick=function(){
      var dogEl=document.getElementById("brd-del-dog");
      var frEl=document.getElementById("brd-del-from");
      var toEl=document.getElementById("brd-del-to");
      if(!dogEl||!dogEl.value||!frEl||!frEl.value||!toEl||!toEl.value){alert("Rellena perro, desde y hasta.");return;}
      if(frEl.value>toEl.value){alert("Fecha inicio debe ser anterior a la final.");return;}
      var dogD=dogEl.value,frD=frEl.value,toD=toEl.value;
      var dD=new Date(frD),eD=new Date(toD),cntD=0;
      while(dD<=eD){
        var dkkD=fd(dD);var arrD=getBD(dkkD).filter(function(d){return d!==dogD;});
        CUSTOM_BD[dkkD]=arrD;dD.setDate(dD.getDate()+1);cntD++;
      }
      saveS();alert(getDn(dogD)+" quitado del boarding "+frD+" a "+toD+" ("+cntD+" dias).");rBill();
    };
    var bbClear=document.getElementById("brd-clear-all");
    if(bbClear)bbClear.onclick=function(){
      if(!confirm("Eliminar TODOS los cambios de boarding?"))return;
      CUSTOM_BD={};saveS();rBill();
    };
  }
}

function rDashTotal(){
  // Aggregate all 12 months
  var grandTot=0,grandColl=0,grandW=0,grandB=0;
  var mthRows=[];
  var topDogs={};    // dog id -> total across all months
  var allPending={}; // client id -> {label,tot,dogs}

  MONTHS.forEach(function(m){
    var inv=clientBill(m.id,att,pay);
    var mTot=0,mColl=0,mW=0,mB=0;
    inv.forEach(function(i){
      mTot+=Number(i.tot);mW+=Number(i.wA);mB+=Number(i.bA);
      if(i.paid==="paid")mColl+=i.tot;
      // accumulate top dogs
      if(!topDogs[i.id])topDogs[i.id]={label:i.label,dogs:i.dogs,tot:0};
      topDogs[i.id].tot+=i.tot;
      // pending across all months
      if(i.paid!=="paid"){
        if(!allPending[i.id])allPending[i.id]={label:i.label,dogs:i.dogs,tot:0};
        allPending[i.id].tot+=i.tot;
      }
    });
    if(mTot>0) mthRows.push({id:m.id,label:m.label,short:m.short,tot:mTot,coll:mColl,pend:mTot-mColl,wA:mW,bA:mB});
    grandTot+=mTot;grandColl+=mColl;grandW+=mW;grandB+=mB;
  });

  var grandPend=grandTot-grandColl;
  var pct=grandTot?Math.round((grandColl/grandTot)*100):0;
  var boardNow=getBD(TODAY).length;

  // Build tabs
  var h='<div class="hrow"><div><div class="page-title">Dashboard</div><div class="page-sub">Resumen anual 2026</div></div>';

var expTab = "list";

function nextExpId(){
  var max=0;
  EXPENSES.forEach(function(e){var n=parseInt(e.id.replace("e",""))||0;if(n>max)max=n;});
  return "e"+(max+1);
}
function expCatById(id){
  for(var i=0;i<EXP_CATS.length;i++)if(EXP_CATS[i].id===id)return EXP_CATS[i];
  return{id:id,label:id,icon:"📦",subs:["Varios"]};
}
function expMonthTotal(mthId){
  return EXPENSES.filter(function(e){return e.date.slice(0,7)===mthId;}).reduce(function(s,e){return s+e.amount;},0);
}
function expMonthIncome(mthId){
  var inv=clientBill(mthId,att,pay);
  return inv.filter(function(i){return i.paid==="paid";}).reduce(function(s,i){return s+i.tot;},0);
}

function rExp(){
  if(expTab==="analytics"){rExpAnalytics();return;}
  rExpList();
}

}

  var c={v:v, s:s||{}};

function buildBillingSheet(fromMth, toMth){
  var wsData=[];
  var colWidths=[{wch:22},{wch:20},{wch:9},{wch:10},{wch:16},{wch:11},{wch:10},{wch:10}];
  MONTHS.forEach(function(m){
    if(m.id<fromMth||m.id>toMth) return;
    var inv=clientBill(m.id,att,pay);
    if(!inv.length) return;
    // Title row
    wsData.push([cell("Facturación — "+m.label,ST.title),"","","","","","",""]);
    wsData.push(["","","","","","","",""]);
    // Headers
    wsData.push([
      cell("Cliente / Perro",ST.hdrL),cell("Perros",ST.hdr),cell("Paseos",ST.hdr),
      cell("Paseos £",ST.hdr),cell("Noches Boarding",ST.hdr),cell("Boarding £",ST.hdr),
      cell("Total £",ST.hdr),cell("Estado",ST.hdr)
    ]);
    inv.forEach(function(cl,ri){
      var bg=ri%2===0?ST.dataE:ST.dataO;
      var bgR=ri%2===0?ST.dataER:ST.dataOR;
      var stE=cl.paid==="paid"?ST.paid:ST.pend;
      wsData.push([
        cell(cl.label,bg),
        cell(cl.dogs.map(getDn).join(" & "),bg),
        cell(cl.wN,bgR,"n"),
        cell(cl.wA,Object.assign({},bgR,{numFmt:'"£"#,##0'}),"n"),
        cell(cl.bN,bgR,"n"),
        cell(cl.bA,Object.assign({},bgR,{numFmt:'"£"#,##0'}),"n"),
        cell(cl.tot,Object.assign({},bgR,{numFmt:'"£"#,##0'}),"n"),
        cell(cl.paid==="paid"?"Pagado":"Pendiente",stE)
      ]);
    });
    var tot=inv.reduce(function(s,c){return s+c.tot;},0);
    var wt=inv.reduce(function(s,c){return s+c.wN;},0);
    var wa=inv.reduce(function(s,c){return s+c.wA;},0);
    var bn=inv.reduce(function(s,c){return s+c.bN;},0);
    var ba=inv.reduce(function(s,c){return s+c.bA;},0);

function wsFromData(sheetObj){
  var ws={};var ref="A1";
  var maxR=sheetObj.data.length,maxC=0;
  sheetObj.data.forEach(function(row,r){
    if(row.length>maxC) maxC=row.length;
    row.forEach(function(cellVal,c){
      var addr=XLSX.utils.encode_cell({r:r,c:c});
      if(!cellVal||cellVal==="") ws[addr]={v:"",t:"s"};
      else ws[addr]=cellVal;
    });
  });
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR-1,c:maxC-1}});
  if(sheetObj.cols) ws["!cols"]=sheetObj.cols;
  // Merge title row across all columns
  var merges=[];
  sheetObj.data.forEach(function(row,r){
    if(row.length>0&&row[0]&&row[0].s&&row[0].s===ST.title){
      merges.push({s:{r:r,c:0},e:{r:r,c:maxC-1}});
    }
  });
  if(merges.length) ws["!merges"]=merges;
  return ws;
}

/* ── Fallback CSV if no internet ── */
function csvQ(v){var s=String(v==null?"":v);return '"'+s.replace(/"/g,'""')+'"';}
function csvLine(cells){return cells.map(csvQ).join(",")+"\r\n";}
function downloadCSV(content,filename){
  var BOM="\uFEFF";
  var blob=new Blob([BOM+content],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},300);
}
function doExportFallback(){
  // Simple CSV fallback — always works, no styling
  var fromEl=document.getElementById("ex-from");var toEl=document.getElementById("ex-to");
  var fromDk=fromEl?fromEl.value:"2026-01-01";var toDk=toEl?toEl.value:"2026-12-31";
  var fromMth=fromDk.slice(0,7),toMth=toDk.slice(0,7);
  var chk=function(id){var el=document.getElementById(id);return el&&el.checked;};
  var csv="sep=,\r\n";
  if(chk("ex-sh-bill")){
    MONTHS.forEach(function(m){
      if(m.id<fromMth||m.id>toMth) return;
      var inv=clientBill(m.id,att,pay);if(!inv.length)return;
      csv+="\r\n"+csvLine(["Facturacion - "+m.label]);
      csv+=csvLine(["Cliente","Perros","Paseos","Paseos £","Noches Boarding","Boarding £","Total £","Estado"]);
      inv.forEach(function(cl){csv+=csvLine([cl.label,cl.dogs.map(getDn).join(" & "),cl.wN,cl.wA,cl.bN,cl.bA,cl.tot,cl.paid==="paid"?"Pagado":"Pendiente"]);});
      csv+=csvLine(["TOTAL","",inv.reduce(function(s,c){return s+c.wN;},0),inv.reduce(function(s,c){return s+c.wA;},0),inv.reduce(function(s,c){return s+c.bN;},0),inv.reduce(function(s,c){return s+c.bA;},0),inv.reduce(function(s,c){return s+c.tot;},0),""]);
    });
  }
  // Gastos en CSV fallback
  if(chk("ex-sh-exp")){
    csv+="\r\n"+csvLine(["--- GASTOS ---"]);
    csv+=csvLine(["Fecha","Categoría","Subcategoría","Importe","Pagador","Descripción"]);
    EXPENSES.forEach(function(exp){
      if(exp.date>=fromDk&&exp.date<=toDk){
        csv+=csvLine([exp.date,exp.cat||"",(exp.subcat||""),(exp.amount||0),(exp.paidBy||""),(exp.desc||"")]);
      }
    });
  }
  downloadCSV(csv,"CayeDJB_"+fromMth+"_a_"+toMth+".csv");
}

function attachExportListeners(){

  var saBtn=document.getElementById("ex-sel-all");
  if(saBtn)saBtn.onclick=function(){["ex-sh-bill","ex-sh-pl","ex-sh-exp","ex-sh-att","ex-sh-brd","ex-sh-rates"].forEach(function(id){var el=document.getElementById(id);if(el)el.checked=true;});};
  var qMap={"qe-all":["ex-sh-bill","ex-sh-pl","ex-sh-exp","ex-sh-att","ex-sh-brd","ex-sh-rates"],"qe-bill":["ex-sh-bill"],"qe-exp":["ex-sh-exp"],"qe-pl":["ex-sh-pl"],"qe-att":["ex-sh-att"],"qe-brd":["ex-sh-brd"]};
  Object.keys(qMap).forEach(function(qid){var btn=document.getElementById(qid);if(!btn)return;btn.onclick=function(){["ex-sh-bill","ex-sh-pl","ex-sh-exp","ex-sh-att","ex-sh-brd","ex-sh-rates"].forEach(function(id){var el=document.getElementById(id);if(el)el.checked=false;});qMap[qid].forEach(function(id){var el=document.getElementById(id);if(el)el.checked=true;});doExport();};});
  var goBtn=document.getElementById("ex-go");

function doExport(){
  var g=document.getElementById("ex-go");
  if(g){g.textContent="Cargando...";g.style.background="#f59e0b";g.disabled=true;}
  loadXLSX(function(){
    if(g){g.textContent="Descargar Excel";g.style.background="#1b2e1e";g.disabled=false;}
    doExportWithXLSX();
  });
}

function goV(id){
  view=id;bFil="all";bSearch="";
  if(id==="exp") expMth=mth;
  if(id==="cal"){var m2=MONTHS.filter(function(x){return x.id===mth;})[0];if(m2){calM=m2.num;calY=m2.year;}}
  document.querySelectorAll(".pnl").forEach(function(p){p.classList.remove("on");p.innerHTML="";});
  document.getElementById("pnl-"+id).classList.add("on");
  rSidebar();render();
}

function setM(id){
  mth=id;bFil="all";bSearch="";dashTotal=false;expMth=id;expEditId=null;
  var m=MONTHS.filter(function(x){return x.id===id;})[0];
  if(view==="ops"){selDate=new Date(id+"-"+(id===TODAY.slice(0,7)?TODAY.slice(8,10):"15"));if(selDate.getDay()===0)selDate.setDate(selDate.getDate()+1);if(selDate.getDay()===6)selDate.setDate(selDate.getDate()+2);}
  if(view==="cal"&&m){calM=m.num;calY=m.year;}
  rSidebar();render();
}

function navDay(dir){
  selDate=new Date(selDate);
  selDate.setDate(selDate.getDate()+dir);
  if(selDate.getDay()===0)selDate.setDate(selDate.getDate()+(dir>0?1:-2));
  if(selDate.getDay()===6)selDate.setDate(selDate.getDate()+(dir>0?2:-1));
  var sy=selDate.getFullYear();
  if(sy===2026||sy===2027){mth=fm(selDate);rSidebar();}
  rOps();
}

function navCalM(dir){
  calM+=dir;
  if(calM<1){calM=12;calY--;}
  if(calM>12){calM=1;calY++;}
  if(calY<2026){calY=2026;calM=1;}
  if(calY>2027){calY=2027;calM=12;}
  calSel=null;rCal();
}

function render(){
  TODAY=getToday();
  if(view==="ops")rOps();
  else if(view==="cal")rCal();
  else if(view==="bill")rBill();
  else if(view==="exp")rExp();
  else rDash();
}
