function p2(n){return n<10?"0"+n:""+n;}

function fm(d){return d.getFullYear()+"-"+p2(d.getMonth()+1);}

function dn(id){return(DP[id]&&DP[id].n)?DP[id].n:(id.charAt(0).toUpperCase()+id.slice(1));}
function hn(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))&0xffff;return h;}

function getDP(id){return DP[id]||CUSTOM_DOGS[id]||{n:id.charAt(0).toUpperCase()+id.slice(1)};}

function getSh(dk){
  var base=CUSTOM_DAYS[dk]||WD[dk];
  if(!base){
    // Fallback: usar DEFAULT_WEEK basado en día de la semana
    var dow=new Date(dk).getDay();
    base=DEFAULT_WEEK[dow]||{s1:[],s2:[],s3:[],s4:[]};
  }
  return{s1:filterInactive(base.s1),s2:filterInactive(base.s2),s3:filterInactive(base.s3),s4:filterInactive(base.s4)};
}

function t3(sh){return(sh.s4||[]).slice();}

    var inact=localStorage.getItem("gz2_inact");if(inact)INACTIVE_DOGS=JSON.parse(inact);
    var sd=localStorage.getItem("gz2m_shift_done");if(sd)shiftDone=JSON.parse(sd);
  }catch(e){}
}

function detectShift(){
  var h=new Date().getHours();
  var m=new Date().getMinutes();
  var mins=h*60+m;
  if(mins<600) return "T1";   // before 10:00
  if(mins<750) return "T1";   // 10:00-12:29 → T1 just finished
  if(mins<900) return "T2";   // 12:30-14:59
  if(mins<1080) return "T3";  // 15:00-17:59
  return "BRD";               // 18:00+
}

function getShiftDogs(dk,shiftId){
  var sh=getSh(dk);
  if(shiftId==="T1") return t1(sh);
  if(shiftId==="T2") return t2(sh);
  if(shiftId==="T3") return t3(sh);
  return [];
}

function getShiftLabel(sid){
  if(sid==="T1") return{name:"TURNO 1",time:"8:15 – 9:30",ico:"🐾"};
  if(sid==="T2") return{name:"TURNO 2",time:"11:20 – 12:30",ico:"🐾"};
  if(sid==="T3") return{name:"TURNO 3",time:"13:30 – 14:45",ico:"🐾"};
  return{name:"BOARDING",time:"Noche",ico:"🏠"};
}

function fmtDate(dk){
  var d=new Date(dk);
  return DS[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear();
}

function getPlanShiftDogs(dk,sid){
  var sh=getSh(dk);
  if(sid==="T1") return t1(sh);
  if(sid==="T2") return t2(sh);
  if(sid==="T3") return t3(sh);
  if(sid==="s1") return (sh.s1||[]).slice();
  if(sid==="s2") return (sh.s2||[]).slice();
  if(sid==="s3") return (sh.s3||[]).slice();
  if(sid==="s4") return (sh.s4||[]).slice();
  return [];
}
function ensureCustomDay(dk){
  if(!CUSTOM_DAYS[dk]){
    var base=WD[dk]||{s1:[],s2:[],s3:[],s4:[]};
    CUSTOM_DAYS[dk]={s1:(base.s1||[]).slice(),s2:(base.s2||[]).slice(),s3:(base.s3||[]).slice(),s4:(base.s4||[]).slice()};
  }
}
function addDogToShift(dogId,shiftId,dk){
  ensureCustomDay(dk);
  // T1→s1, T2→s3, T3→s4
  var real=shiftId==="T1"?"s1":shiftId==="T2"?"s3":shiftId==="T3"?"s4":shiftId;
  if(CUSTOM_DAYS[dk][real].indexOf(dogId)<0){
    CUSTOM_DAYS[dk][real].push(dogId);
  }
  saveS();render();
}
function removeDogFromShift(dogId,shiftId,dk){
  ensureCustomDay(dk);
  if(shiftId==="T1"){
    // Remove from both s1 and s2
    CUSTOM_DAYS[dk].s1=CUSTOM_DAYS[dk].s1.filter(function(d){return d!==dogId;});
    CUSTOM_DAYS[dk].s2=CUSTOM_DAYS[dk].s2.filter(function(d){return d!==dogId;});
  } else {
    var real=shiftId==="T2"?"s3":shiftId==="T3"?"s4":shiftId;
    CUSTOM_DAYS[dk][real]=CUSTOM_DAYS[dk][real].filter(function(d){return d!==dogId;});
  }
  saveS();render();
}
function addNewDog(name){
  var id=name.toLowerCase().trim();
  if(!id)return;
  CUSTOM_DOGS[id]={n:name.trim().charAt(0).toUpperCase()+name.trim().slice(1)};
  localStorage.setItem("gz2_cdog",JSON.stringify(CUSTOM_DOGS));
  saveS();
}
function getAllDogIds(){
  var m={};
  Object.keys(DP).forEach(function(k){m[k]=1;});
  Object.keys(CUSTOM_DOGS).forEach(function(k){m[k]=1;});
  return Object.keys(m).filter(function(k){return!INACTIVE_DOGS[k];});
}
function countDogShifts(dogId,dk){
  var c=0;
  ["T1","T2","T3"].forEach(function(t){
    if(getPlanShiftDogs(dk,t).indexOf(dogId)>=0)c++;
  });
  return c;
}

function facturar(){
  var today=getToday();
  // Count entries to archive
  var attCount=0,sdCount=0,bdCount=0;
  Object.keys(att).forEach(function(k){if(k.substring(0,10)<today)attCount++;});
  Object.keys(shiftDone).forEach(function(k){if(k.substring(0,10)<today)sdCount++;});
  Object.keys(CUSTOM_BD).forEach(function(k){if(k<today)bdCount++;});
  var total=attCount+sdCount+bdCount;
  if(total===0){alert("✅ No hay datos antiguos que archivar.");return;}
  var msg="💰 ¿TODO FACTURADO?\n\n";
  msg+="Se van a archivar "+total+" registros anteriores a hoy:\n";
  msg+="• "+attCount+" registros de asistencia\n";
  msg+="• "+sdCount+" registros de turnos\n";
  msg+="• "+bdCount+" registros de boarding\n\n";
  msg+="Los datos de HOY se conservan.\n";
  msg+="Esta acción NO se puede deshacer.";
  if(!confirm(msg))return;
  // Purge old att entries
  Object.keys(att).forEach(function(k){if(k.substring(0,10)<today)delete att[k];});
  // Purge old shiftDone entries
  Object.keys(shiftDone).forEach(function(k){if(k.substring(0,10)<today)delete shiftDone[k];});
  // Purge old CUSTOM_BD entries
  Object.keys(CUSTOM_BD).forEach(function(k){if(k<today)delete CUSTOM_BD[k];});
  // Purge old notification flags
  Object.keys(localStorage).forEach(function(k){
    if(k.indexOf("gz2m_notified_")===0){
      var datePart=k.replace("gz2m_notified_","").substring(0,10);
      if(datePart<today)localStorage.removeItem(k);
    }
  });
  saveS();
  syncPush();
  alert("✅ Datos archivados. Sistema limpio y listo para el nuevo periodo.");
  render();
}

/* ═══ BACKUP ═══ */
function exportBackup(){
  var data={
    att:att,
    CUSTOM_BD:CUSTOM_BD,
    EXPENSES:EXPENSES,
    CUSTOM_DOGS:CUSTOM_DOGS,
    INACTIVE_DOGS:INACTIVE_DOGS,
    shiftDone:shiftDone,
    _exported:new Date().toISOString(),
    _version:"CayeDJB-mobile-backup-v1",
    _source:"mobile"
  };
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="CayeDJB_mobile_"+TODAY.replace(/-/g,"")+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert("✅ Backup exportado.");
}

function importBackup(file){
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!data._version){alert("Archivo no válido.");return;}
      if(!confirm("¿Restaurar backup del "+data._exported+"?"))return;
      if(data.att)att=data.att;
      if(data.CUSTOM_BD)CUSTOM_BD=data.CUSTOM_BD;
      if(data.EXPENSES)EXPENSES=data.EXPENSES;
      if(data.CUSTOM_DOGS)CUSTOM_DOGS=data.CUSTOM_DOGS;
      if(data.INACTIVE_DOGS)INACTIVE_DOGS=data.INACTIVE_DOGS;
      if(data.shiftDone)shiftDone=data.shiftDone;
      saveS();render();
      alert("✅ Backup restaurado.");
    }catch(e){alert("Error: "+e.message);}
  };
  reader.readAsText(file);
}

/* ═══ NOTIFICATIONS ═══ */
function checkNotifications(){
  var h=new Date().getHours(),m=new Date().getMinutes();
  var nowMin=h*60+m;
  var dk=getToday();
  var shifts=[
    {id:"T1",notifyAt:570,label:"Turno 1 terminado"},
    {id:"T2",notifyAt:750,label:"Turno 2 terminado"},
    {id:"T3",notifyAt:885,label:"Turno 3 terminado"}
  ];
  shifts.forEach(function(s){
    var doneKey2="gz2m_notified_"+dk+"_"+s.id;
    var shiftDoneKey2=dk+"|"+s.id;
    if(nowMin>=s.notifyAt&&!localStorage.getItem(doneKey2)&&!shiftDone[shiftDoneKey2]){
      if(Notification.permission==="granted"){
        new Notification("🐾 "+s.label,{body:"¿Qué perros vinieron? Confirma en la app.",icon:"🐾"});
      }
      localStorage.setItem(doneKey2,"1");
    }
  });
  // 17:00 recap — any shift still pending
  var recapKey="gz2m_notified_"+dk+"_recap";
  if(nowMin>=1020&&!localStorage.getItem(recapKey)){
    var anyPending=!shiftDone[dk+"|T1"]||!shiftDone[dk+"|T2"]||!shiftDone[dk+"|T3"];
    if(anyPending){
      if(Notification.permission==="granted"){
        new Notification("📋 Confirma los paseos de hoy",{body:"Tienes turnos sin completar. Abre la app."});
      }
    }
    localStorage.setItem(recapKey,"1");
  }
  // 21:00 boarding
  if(nowMin>=1260&&!localStorage.getItem("gz2m_notified_"+dk+"_BRD")&&!shiftDone[dk+"|BRD"]){
    if(Notification.permission==="granted"){
      new Notification("🏠 Confirma Boarding",{body:"¿Quién se queda esta noche?"});
    }
    localStorage.setItem("gz2m_notified_"+dk+"_BRD","1");
  }
}
setInterval(checkNotifications,60000);

  var swBlob=new Blob([swCode],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(function(){});
}
if("Notification" in window&&Notification.permission==="default"){
  Notification.requestPermission();
}

/* ═══ SYNC — FIREBASE v4 ═══ */
// LEGACY GAS — borrar en fase 10
// Se conserva CLOUD_SYNC_URL como referencia; ya no se usa.
var CLOUD_SYNC_URL="https://script.google.com/macros/s/AKfycby_GtltbcWOqAEcqiXvVjH__WsVTIGDRm9azMhYQj1A1TBI1xI3fuRVJhzvt5jR0s5N/exec";
var LOCAL_SYNC_URL="";
function getSyncUrl(){return CLOUD_SYNC_URL||LOCAL_SYNC_URL;} // LEGACY GAS — borrar en fase 10
var syncStatus="unknown";
var offlineQueue=[]; // LEGACY GAS — el SDK de Firebase tiene su propia cola IndexedDB

// LEGACY GAS — borrar en fase 10
function saveOfflineQueue(){
  try{localStorage.setItem("gz2m_offline_queue",JSON.stringify(offlineQueue));}catch(e){}
}

// FIREBASE v4 — diff-and-emit. Lo invoca saveS() tras cada mutación del usuario.
// CayeSync compara los globals contra lastSynced* y emite los cambios:
//   - att/shiftDone → events/{id} con LWW por key
//   - CUSTOM_DOGS/CUSTOM_BD/CUSTOM_DAYS/INACTIVE_DOGS → state/main (merge)
//   - EXPENSES → expenses/{id}
// El SDK gestiona la cola offline en IndexedDB.
function syncPush(){
  syncStatus="syncing"; updateSyncBadge();
  if (!window.CayeSync) { syncStatus="offline"; updateSyncBadge(); return; }
  try {
    window.CayeSync.syncFromGlobals({
      att: att,
      shiftDone: shiftDone,
      state: {
        CUSTOM_DOGS: CUSTOM_DOGS,
        CUSTOM_BD:   CUSTOM_BD,
        CUSTOM_DAYS: CUSTOM_DAYS,
        INACTIVE_DOGS: INACTIVE_DOGS
      },
      expenses: EXPENSES
    });
    syncStatus="ok"; updateSyncBadge();
  } catch(e){
    console.error("syncPush failed", e);
    syncStatus="offline"; updateSyncBadge();
  }
}

// FIREBASE v4 — los listeners realtime de CayeSync.bootstrap() reemplazan el pull.
// syncPull queda como no-op para compatibilidad con call-sites existentes.
function syncPull(cb){ if(cb)cb(); }

function updateSyncBadge(){
  var el=document.querySelector(".hdr-sync");
  if(!el)return;
  var qLen=offlineQueue.length;
  // Remove old offline bar if exists
  var oldBar=document.getElementById("offline-bar");
  if(oldBar)oldBar.remove();
  if(syncStatus==="ok"&&!qLen){
    el.style.background="#f0fdf4";el.style.color="#15803d";el.style.borderColor="#86efac";el.textContent="🟢 OK";
  } else if(syncStatus==="syncing"){
    el.style.background="#eff6ff";el.style.color="#1d4ed8";el.style.borderColor="#93c5fd";el.textContent="🔄";
  } else if(syncStatus==="offline"||qLen){
    el.style.background="#fffbeb";el.style.color="#b45309";el.style.borderColor="#fde68a";el.textContent="⚡ "+qLen;
    // Inject amber offline bar below header
    var hdr=document.querySelector(".hdr");
    if(hdr&&!document.getElementById("offline-bar")){
      var bar=document.createElement("div");
      bar.id="offline-bar";
      bar.style.cssText="background:#fef3c7;color:#92400e;text-align:center;padding:6px 12px;font-size:12px;font-weight:700;border-bottom:1.5px solid #fde68a;letter-spacing:.02em";
      bar.textContent="⚡ Trabajando sin conexión"+(qLen?" ("+qLen+" en cola)":"");
      hdr.insertAdjacentElement("afterend",bar);
    }
  } else {
    el.style.background="#f0f0ec";el.style.color="#888";el.style.borderColor="#d4d0c8";el.textContent="⚪";
  }
}

// Retry offline queue when internet returns
function flushOfflineQueue(){
  if(!offlineQueue.length)return;
  var url=getSyncUrl();
  if(!url)return;
  var item=offlineQueue[0];
  var isCloud=!!CLOUD_SYNC_URL;
  var xhr=new XMLHttpRequest();
  xhr.open("POST",url,true);
  xhr.setRequestHeader("Content-Type",isCloud?"text/plain":"application/json");
  xhr.timeout=15000;
  xhr.onload=function(){
    offlineQueue.shift();saveOfflineQueue();
    updateSyncBadge();
    if(offlineQueue.length)setTimeout(flushOfflineQueue,2000);
  };
  xhr.onerror=function(){};
  xhr.send(item.payload);
}
// LEGACY GAS — borrar en fase 10
window.addEventListener("online",function(){flushOfflineQueue();});
setInterval(function(){if(offlineQueue.length)flushOfflineQueue();},60000);

/* ═══ INIT ═══ */
// FIREBASE v4 — orden:
//   1. loadS() pinta inmediato desde localStorage (UI rápida, offline-friendly)
//   2. render() inicial con datos locales
//   3. CayeSync.bootstrap() arranca listeners; cuando llegan datos del server,
//      sobrescribe los globals y re-renderiza
loadS();
render();
if (window.CayeSync) {
  window.CayeSync.bootstrap({
    onState: function(data){
      if (data.CUSTOM_DOGS)   CUSTOM_DOGS   = data.CUSTOM_DOGS;
      if (data.CUSTOM_BD)     CUSTOM_BD     = data.CUSTOM_BD;
      if (data.CUSTOM_DAYS)   CUSTOM_DAYS   = data.CUSTOM_DAYS;
      if (data.INACTIVE_DOGS) INACTIVE_DOGS = data.INACTIVE_DOGS;
      try { render(); } catch(e){ console.error("render after onState failed", e); }
    },
    onEvents: function(reduced){
      att = reduced.att || {};
      shiftDone = reduced.shiftDone || {};
      try { render(); } catch(e){ console.error("render after onEvents failed", e); }
    },
    onExpenses: function(arr){
      EXPENSES = arr || [];
      try { render(); } catch(e){ console.error("render after onExpenses failed", e); }
    }
  });
  syncStatus="ok"; updateSyncBadge();
}
</script>
